<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

    <div class="gift-container" id="gift-screen">
        <div class="gift-box">🎁</div>
        <p class="click-text">Tap to Open!</p>
    </div>

    <main class="card-container" id="main-card" style="display: none;">
        <div id="character-container" class="character-box"></div>

        <div class="text-content">
            <h2 class="role-badge" id="role-text">Loading Role...</h2>
            <h1 class="birthday-title">Happy Birthday, <span id="name-text">...</span>!</h1>
            
            <div class="message-box">
                <p id="message-text">Loading your special message...</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
